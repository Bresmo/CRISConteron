<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración del Negocio · Admin Maison Aurum</title>
    
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="admin-body">

    <aside class="admin-sidebar">
        <div class="admin-sidebar-brand">MAISON <span>AURUM</span></div>
        <nav class="admin-nav">
            <a href="dashboard.html" class="admin-nav-item"><i class="ph ph-squares-four"></i> Dashboard</a>
            <a href="servicios.html" class="admin-nav-item"><i class="ph ph-scissors"></i> Servicios</a>
            <a href="equipo.html" class="admin-nav-item"><i class="ph ph-users"></i> Equipo</a>
            <a href="citas.html" class="admin-nav-item"><i class="ph ph-calendar-check"></i> Citas</a>
            <a href="contabilidad.html" class="admin-nav-item"><i class="ph ph-chart-line-up"></i> Contabilidad</a>
            <a href="clientes.html" class="admin-nav-item"><i class="ph ph-address-book"></i> Clientes</a>
            <a href="configuracion.html" class="admin-nav-item active"><i class="ph ph-gear"></i> Configuración</a>
        </nav>
        <div class="admin-sidebar-footer">
            <button id="btn-logout" class="btn-outline" style="width: 100%; font-size: 0.8rem; padding: 0.6rem;"><i class="ph ph-sign-out"></i> Cerrar Sesión</button>
        </div>
    </aside>

    <main class="admin-main">
        <header class="admin-header">
            <div class="admin-header-title"><h1>Configuración del Salón</h1></div>
            <div class="admin-user-info"><span id="admin-user-name">Cargando...</span></div>
        </header>

        <div class="admin-content">
            <div class="admin-card" style="max-width: 800px;">
                <div class="admin-card-header">
                    <h3>Parámetros Generales y Textos Públicos</h3>
                </div>
                <form id="form-config">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div class="form-group">
                            <label>Nombre del Salón</label>
                            <input type="text" id="cfg-nombre_salon" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Eslogan</label>
                            <input type="text" id="cfg-eslogan" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Descripción Corta (SEO / Hero)</label>
                        <textarea id="cfg-descripcion_corta" class="form-control" rows="2"></textarea>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div class="form-group">
                            <label>Teléfono de Contacto</label>
                            <input type="text" id="cfg-telefono" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Número WhatsApp (sin símbolo +)</label>
                            <input type="text" id="cfg-whatsapp" class="form-control">
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div class="form-group">
                            <label>Correo Electrónico</label>
                            <input type="email" id="cfg-email" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Ciudad y País</label>
                            <input type="text" id="cfg-ciudad" class="form-control">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Dirección Física</label>
                        <input type="text" id="cfg-direccion" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Texto de Horarios</label>
                        <input type="text" id="cfg-horario_texto" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Política de Cancelación</label>
                        <textarea id="cfg-politica_cancelacion" class="form-control" rows="2"></textarea>
                    </div>
                    <div style="display: flex; justify-content: flex-end; margin-top: 2rem;">
                        <button type="submit" class="btn-gold">Guardar Configuración</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script type="module">
        import { checkAdminAuth } from '../js/auth.js';
        import { supabase } from '../js/supabaseClient.js';

        document.addEventListener('DOMContentLoaded', async () => {
            const user = await checkAdminAuth();
            if (!user) return;

            const { data, error } = await supabase.from('configuracion').select('*');
            if (error) { console.error(error); return; }

            data.forEach(item => {
                const input = document.getElementById(`cfg-${item.clave}`);
                if (input) input.value = item.valor;
            });

            document.getElementById('form-config').onsubmit = async (e) => {
                e.preventDefault();
                const claves = ['nombre_salon', 'eslogan', 'descripcion_corta', 'telefono', 'whatsapp', 'email', 'ciudad', 'direccion', 'horario_texto', 'politica_cancelacion'];
                
                for (let clave of claves) {
                    const valor = document.getElementById(`cfg-${clave}`).value;
                    await supabase.from('configuracion').upsert({ clave, valor });
                }

                alert('Configuración actualizada con éxito.');
            };
        });
    </script>
</body>
</html>
