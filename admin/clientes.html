<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes · Admin Camilo Mideros</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="admin-body">

    <!-- Sidebar dinámico inyectado por renderSidebar('clientes') -->
    <aside class="admin-sidebar"></aside>

    <main class="admin-main">
        <header class="admin-header">
            <div class="admin-header-title">
                <h1>Clientes</h1>
            </div>
            <div class="admin-user-info">
                <span id="admin-user-name">Cargando...</span>
            </div>
        </header>

        <div class="admin-content">
            <div class="admin-card">
                <div class="admin-card-header">
                    <h3>Base de Clientes <span id="clientes-resumen" style="opacity:.6;font-size:.85rem;"></span></h3>
                    <div style="display:flex;gap:.6rem;flex-wrap:wrap;">
                        <button class="btn-outline" id="btn-exportar-clientes" style="padding:.5rem 1rem;font-size:.75rem;"><i class="ph ph-download-simple"></i> Exportar CSV</button>
                        <button class="btn-gold" id="btn-nuevo-cliente" style="padding:.5rem 1rem;font-size:.75rem;"><i class="ph ph-plus"></i> Nuevo Cliente</button>
                    </div>
                </div>
                <div class="admin-filters">
                    <input type="text" id="search-clientes" class="admin-search-input" placeholder="Buscar por nombre, teléfono o correo...">
                    <select id="orden-clientes" class="form-control" style="width:auto;">
                        <option value="nombre">Ordenar: nombre (A-Z)</option>
                        <option value="gasto">Ordenar: mayor gasto</option>
                        <option value="visitas">Ordenar: más visitas</option>
                        <option value="ultima">Ordenar: visita más reciente</option>
                        <option value="registro">Ordenar: registrados recientemente</option>
                    </select>
                </div>
                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>Teléfono</th>
                                <th>Visitas</th>
                                <th>Gasto total</th>
                                <th>Última visita</th>
                                <th style="text-align:right;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="clientes-tbody">
                            <!-- JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Cliente (crear / editar) -->
    <div id="modal-cliente" class="modal-overlay">
        <div class="modal-container" style="max-width:560px;">
            <div class="modal-header">
                <h3 id="modal-cliente-titulo">Nuevo Cliente</h3>
                <button class="modal-close" onclick="window.cerrarModalCliente()">&times;</button>
            </div>
            <form id="form-cliente">
                <input type="hidden" id="cli-id">
                <div class="form-group">
                    <label>Nombre y apellido *</label>
                    <input type="text" id="cli-nombre" class="form-control" required>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                    <div class="form-group">
                        <label>Teléfono *</label>
                        <input type="text" id="cli-telefono" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Correo</label>
                        <input type="email" id="cli-email" class="form-control">
                    </div>
                </div>
                <div class="form-group">
                    <label>Notas (preferencias, alergias a productos, etc.)</label>
                    <textarea id="cli-notas" class="form-control" rows="3"></textarea>
                </div>
                <div style="display:flex;justify-content:flex-end;gap:1rem;margin-top:1.5rem;">
                    <button type="button" class="btn-outline" onclick="window.cerrarModalCliente()">Cancelar</button>
                    <button type="submit" class="btn-gold">Guardar Cliente</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Detalle del cliente -->
    <div id="modal-cliente-detalle" class="modal-overlay">
        <div class="modal-container" style="max-width:780px;">
            <div class="modal-header">
                <h3 id="detalle-cliente-titulo">Cliente</h3>
                <button class="modal-close" onclick="window.cerrarModalClienteDetalle()">&times;</button>
            </div>
            <div id="detalle-cliente-resumen"></div>
            <h4 style="margin:1.5rem 0 .75rem;font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;color:#363636;">Historial de citas</h4>
            <div class="table-responsive" style="max-height:300px;overflow-y:auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Servicio</th>
                            <th>Especialista</th>
                            <th>Estado</th>
                            <th style="text-align:right;">Monto</th>
                        </tr>
                    </thead>
                    <tbody id="detalle-cliente-historial"></tbody>
                </table>
            </div>
            <div style="display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.5rem;">
                <button type="button" class="btn-outline" id="btn-detalle-editar">Editar cliente</button>
                <button type="button" class="btn-outline" onclick="window.cerrarModalClienteDetalle()">Cerrar</button>
            </div>
        </div>
    </div>

    <script type="module" src="../js/admin/clientes.js"></script>
</body>
</html>
