<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/img/cris-conteron-favicon.png">
    <title>Dashboard · Admin CRIS Conterón</title>
    
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="admin-body">

    <aside class="admin-sidebar"></aside>

    <main class="admin-main">
        <header class="admin-header">
            <div class="admin-header-title"><h1>Panel de Control</h1></div>
            <div class="admin-user-info"><span id="admin-user-name">Cargando...</span></div>
        </header>

        <div class="admin-content">
            <!-- Métricas Principales -->
            <div class="dashboard-metrics">
                <div class="admin-card" style="margin-bottom: 0; padding: 1.5rem;">
                    <span style="color: var(--color-text-secondary); font-size: 0.85rem; text-transform: uppercase;">Ingresos de Hoy</span>
                    <h2 id="metric-ingresos-hoy" style="font-size: 2rem; color: var(--color-accent); margin-top: 0.5rem;">$0.00</h2>
                </div>
                <div class="admin-card" style="margin-bottom: 0; padding: 1.5rem;">
                    <span style="color: var(--color-text-secondary); font-size: 0.85rem; text-transform: uppercase;">Citas para Hoy</span>
                    <h2 id="metric-citas-hoy" style="font-size: 2rem; margin-top: 0.5rem;">0</h2>
                </div>
                <div class="admin-card" style="margin-bottom: 0; padding: 1.5rem;">
                    <span style="color: var(--color-text-secondary); font-size: 0.85rem; text-transform: uppercase;">Clientes Registrados</span>
                    <h2 id="metric-total-clientes" style="font-size: 2rem; margin-top: 0.5rem;">0</h2>
                </div>
            </div>

            <!-- Gráficos y Listados -->
            <div class="dashboard-panels">
                <div class="admin-card" style="margin-bottom: 0;">
                    <h3 style="margin-bottom: 1.5rem;">Comportamiento Financiero (Últimos 30 Días)</h3>
                    <div style="height: 300px;"><canvas id="chartDashboard"></canvas></div>
                </div>
                <div class="admin-card" style="margin-bottom: 0;">
                    <h3 style="margin-bottom: 1.5rem;">Citas de Hoy</h3>
                    <div id="citas-hoy-list" style="display: flex; flex-direction: column; gap: 1rem; max-height: 300px; overflow-y: auto;">
                        <p style="color: var(--color-text-secondary); font-size: 0.9rem;">No hay citas registradas para hoy.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { checkAdminAuth } from '../js/auth.js';
        import { supabase } from '../js/supabaseClient.js';
        import { renderSidebar } from '../js/admin/utils.js';

        document.addEventListener('DOMContentLoaded', async () => {
            renderSidebar('dashboard');
            const user = await checkAdminAuth();
            if (!user) return;

            const hoy = new Date().toISOString().split('T')[0];

            // Cargar métricas
            const [ingresosRes, citasRes, clientesRes, reporteRes] = await Promise.all([
                supabase.from('ingresos').select('monto').eq('fecha', hoy),
                supabase.from('citas').select('*, clientes(nombre, telefono), servicios(nombre)').eq('fecha', hoy).order('hora_inicio'),
                supabase.from('clientes').select('id', { count: 'exact', head: true }),
                supabase.rpc('reporte_financiero_periodo', { p_agrupacion: 'day', p_fecha_inicio: new Date(Date.now() - 30*24*60*60*1000).toISOString().split('T')[0], p_fecha_fin: hoy })
            ]);

            const totalIngresosHoy = ingresosRes.data ? ingresosRes.data.reduce((acc, curr) => acc + Number(curr.monto), 0) : 0;
            document.getElementById('metric-ingresos-hoy').textContent = `$${totalIngresosHoy.toFixed(2)}`;
            document.getElementById('metric-citas-hoy').textContent = citasRes.data ? citasRes.data.length : 0;
            document.getElementById('metric-total-clientes').textContent = clientesRes.count || 0;

            // Renderizar citas de hoy
            const citasContainer = document.getElementById('citas-hoy-list');
            if (citasRes.data && citasRes.data.length > 0) {
                citasContainer.innerHTML = citasRes.data.map(c => `
                    <div style="background: var(--color-bg-card); padding: 1rem; border-radius: var(--radius-sm); border-left: 3px solid var(--color-accent);">
                        <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.25rem;">
                            <strong>${c.hora_inicio.slice(0, 5)}</strong>
                            <span class="badge ${c.estado === 'completada' ? 'badge-success' : c.estado === 'confirmada' ? 'badge-info' : 'badge-warning'}">${c.estado}</span>
                        </div>
                        <div style="font-weight: 600; font-size: 0.95rem;">${c.clientes?.nombre || 'Cliente'}</div>
                        <div style="font-size: 0.85rem; color: var(--color-text-secondary);">${c.servicios?.nombre || 'Servicio'}</div>
                    </div>
                `).join('');
            }

            // Gráfico Dashboard
            if (reporteRes.data) {
                const labels = reporteRes.data.map(r => r.periodo);
                const ingresos = reporteRes.data.map(r => r.total_ingresos);
                const gastos = reporteRes.data.map(r => r.total_gastos);

                const ctx = document.getElementById('chartDashboard').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            { label: 'Ingresos', data: ingresos, borderColor: '#e8e1d5', backgroundColor: 'rgba(232,225,213,0.12)', fill: true, tension: 0.3 },
                            { label: 'Gastos', data: gastos, borderColor: '#9c958b', backgroundColor: 'rgba(156,149,139,0.16)', fill: true, tension: 0.3 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { labels: { color: '#f0eadf' } } },
                        scales: {
                            x: { ticks: { color: '#c9c2b7' }, grid: { color: 'rgba(232,225,213,0.1)' } },
                            y: { ticks: { color: '#c9c2b7' }, grid: { color: 'rgba(232,225,213,0.1)' } }
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
