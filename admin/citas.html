<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Citas · Admin Camilo Mideros</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="admin-body">

    <!-- Sidebar dinámico inyectado por renderSidebar('citas') -->
    <aside class="admin-sidebar"></aside>

    <main class="admin-main">
        <header class="admin-header">
            <div class="admin-header-title">
                <h1>Agenda de Citas</h1>
            </div>
            <div class="admin-user-info">
                <span id="admin-user-name">Cargando...</span>
            </div>
        </header>

        <div class="admin-content">

            <!-- Pendientes por confirmar -->
            <div class="admin-card">
                <div class="admin-card-header">
                    <h3>Pendientes por confirmar <span id="pendientes-contador" style="opacity:.6;font-size:.85rem;"></span></h3>
                </div>
                <div id="pendientes-lista" class="cal-lista">
                    <!-- JS -->
                </div>
            </div>

            <!-- Calendario -->
            <div class="admin-card">
                <div class="admin-card-header">
                    <h3>Calendario</h3>
                    <button class="btn-gold" id="btn-nueva-cita" style="padding: 0.5rem 1rem; font-size: 0.75rem;"><i class="ph ph-plus"></i> Nueva Cita</button>
                </div>

                <div class="cal-toolbar">
                    <div class="cal-nav">
                        <button type="button" class="btn-outline" id="cal-prev" title="Anterior" style="padding:.4rem .7rem;"><i class="ph ph-caret-left"></i></button>
                        <button type="button" class="btn-outline" id="cal-hoy" style="padding:.4rem .9rem;font-size:.75rem;">Hoy</button>
                        <button type="button" class="btn-outline" id="cal-next" title="Siguiente" style="padding:.4rem .7rem;"><i class="ph ph-caret-right"></i></button>
                        <span class="cal-titulo" id="cal-titulo"></span>
                    </div>
                    <div class="cal-vistas">
                        <button type="button" class="btn-outline" data-vista="dia" style="padding:.4rem .9rem;font-size:.75rem;">Día</button>
                        <button type="button" class="btn-outline" data-vista="semana" style="padding:.4rem .9rem;font-size:.75rem;">Semana</button>
                        <button type="button" class="btn-outline" data-vista="mes" style="padding:.4rem .9rem;font-size:.75rem;">Mes</button>
                    </div>
                </div>

                <div class="admin-filters">
                    <select id="filtro-peluquero-cita" class="form-control" style="width: auto;">
                        <option value="">Todos los especialistas</option>
                    </select>
                    <select id="filtro-estado-cita" class="form-control" style="width: auto;">
                        <option value="">Todos los estados</option>
                        <option value="pendiente">Pendientes</option>
                        <option value="confirmada">Confirmadas</option>
                        <option value="completada">Completadas</option>
                        <option value="cancelada">Canceladas</option>
                    </select>
                    <span id="cal-resumen" style="font-size:.8rem;opacity:.7;align-self:center;"></span>
                </div>

                <div id="calendario">
                    <!-- JS -->
                </div>
            </div>

        </div>
    </main>

    <!-- Modal Cita (crear / editar) -->
    <div id="modal-cita" class="modal-overlay">
        <div class="modal-container" style="max-width: 720px;">
            <div class="modal-header">
                <h3 id="modal-cita-titulo">Nueva Cita</h3>
                <button class="modal-close" onclick="window.cerrarModalCita()">&times;</button>
            </div>
            <form id="form-cita">
                <input type="hidden" id="cita-id">

                <!-- Cliente -->
                <div class="form-group">
                    <label>Cliente *</label>
                    <div id="cli-seleccionado" style="display:none;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem .9rem;border:1px solid #878787;border-radius:8px;">
                        <span id="cli-seleccionado-texto"></span>
                        <button type="button" class="btn-outline" id="btn-cli-cambiar" style="padding:.25rem .7rem;font-size:.72rem;">Cambiar</button>
                    </div>
                    <div id="cli-buscador">
                        <input type="text" id="cli-buscar" class="form-control" placeholder="Buscar por nombre, teléfono o correo..." autocomplete="off">
                        <div id="cli-resultados" class="cal-cliente-res"></div>
                        <button type="button" class="btn-outline" id="btn-cli-nuevo" style="margin-top:.6rem;padding:.3rem .8rem;font-size:.75rem;"><i class="ph ph-plus"></i> Cliente nuevo</button>
                    </div>
                    <div id="cli-nuevo-box" style="display:none;">
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                            <div class="form-group">
                                <label>Nombre y apellido *</label>
                                <input type="text" id="cli-nombre" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Teléfono *</label>
                                <input type="text" id="cli-telefono" class="form-control">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Correo (opcional)</label>
                            <input type="email" id="cli-email" class="form-control">
                        </div>
                        <button type="button" class="btn-outline" id="btn-cli-volver" style="padding:.3rem .8rem;font-size:.75rem;">Buscar cliente existente</button>
                    </div>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                    <div class="form-group">
                        <label>Servicio *</label>
                        <select id="cita-servicio" class="form-control"></select>
                    </div>
                    <div class="form-group">
                        <label>Especialista *</label>
                        <select id="cita-peluquero" class="form-control"></select>
                    </div>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;">
                    <div class="form-group">
                        <label>Fecha *</label>
                        <input type="date" id="cita-fecha" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Hora de inicio *</label>
                        <input type="time" id="cita-hora" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select id="cita-estado" class="form-control">
                            <option value="confirmada">Confirmada</option>
                            <option value="pendiente">Pendiente</option>
                            <option value="cancelada">Cancelada</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Horas libres sugeridas <span id="cita-fin" style="opacity:.6;text-transform:none;letter-spacing:0;"></span></label>
                    <div id="cita-slots" class="cal-chips-horas"></div>
                </div>

                <div class="form-group" style="max-width:220px;">
                    <label>Precio (USD)</label>
                    <input type="number" step="0.01" min="0" id="cita-precio" class="form-control">
                </div>

                <div style="display:flex;justify-content:flex-end;gap:1rem;margin-top:2rem;">
                    <button type="button" class="btn-outline" onclick="window.cerrarModalCita()">Cancelar</button>
                    <button type="submit" class="btn-gold">Guardar Cita</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Detalle -->
    <div id="modal-detalle" class="modal-overlay">
        <div class="modal-container" style="max-width: 560px;">
            <div class="modal-header">
                <h3>Detalle de la cita</h3>
                <button class="modal-close" onclick="window.cerrarModalDetalle()">&times;</button>
            </div>
            <div id="detalle-contenido"></div>
            <div id="detalle-acciones" style="display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.6rem;margin-top:1.5rem;"></div>
        </div>
    </div>

    <!-- Modal Completar -->
    <div id="modal-completar" class="modal-overlay">
        <div class="modal-container" style="max-width: 460px;">
            <div class="modal-header">
                <h3>Completar cita</h3>
                <button class="modal-close" onclick="window.cerrarModalCompletar()">&times;</button>
            </div>
            <form id="form-completar">
                <input type="hidden" id="comp-id">
                <p id="comp-resumen" style="opacity:.8;font-size:.9rem;margin-bottom:1rem;"></p>
                <div class="form-group">
                    <label>Precio cobrado (USD) *</label>
                    <input type="number" step="0.01" min="0" id="comp-precio" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Método de pago *</label>
                    <select id="comp-metodo" class="form-control">
                        <option value="efectivo">Efectivo</option>
                        <option value="tarjeta">Tarjeta</option>
                        <option value="transferencia">Transferencia</option>
                    </select>
                </div>
                <p style="opacity:.6;font-size:.78rem;">Al completar la cita se registra automáticamente el ingreso en la contabilidad.</p>
                <div style="display:flex;justify-content:flex-end;gap:1rem;margin-top:1.5rem;">
                    <button type="button" class="btn-outline" onclick="window.cerrarModalCompletar()">Cancelar</button>
                    <button type="submit" class="btn-gold">Completar y cobrar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../js/admin/citas.js"></script>
</body>
</html>
