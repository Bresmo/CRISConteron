<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Servicios · Admin Maison Aurum</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="admin-body">

    <!-- Sidebar dinámico inyectado por renderSidebar('servicios') -->
    <aside class="admin-sidebar"></aside>

    <main class="admin-main">
        <header class="admin-header">
            <div class="admin-header-title">
                <h1>Servicios y Categorías</h1>
            </div>
            <div class="admin-user-info">
                <span id="admin-user-name">Cargando...</span>
            </div>
        </header>

        <div class="admin-content">

            <!-- Catálogo de servicios -->
            <div class="admin-card">
                <div class="admin-card-header">
                    <h3>Catálogo de Servicios</h3>
                    <button class="btn-gold" id="btn-nuevo-servicio" style="padding: 0.5rem 1rem; font-size: 0.75rem;"><i class="ph ph-plus"></i> Nuevo Servicio</button>
                </div>
                <div class="admin-filters">
                    <input type="text" id="search-servicios" class="admin-search-input" placeholder="Buscar por nombre o descripción...">
                    <select id="filtro-categoria-servicio" class="form-control" style="width: auto;">
                        <option value="">Todas las categorías</option>
                    </select>
                    <select id="filtro-estado-servicio" class="form-control" style="width: auto;">
                        <option value="">Todos los estados</option>
                        <option value="true">Visibles</option>
                        <option value="false">Ocultos</option>
                    </select>
                </div>
                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Imagen</th>
                                <th>Servicio</th>
                                <th>Categoría</th>
                                <th>Duración</th>
                                <th>Precio</th>
                                <th>Estado</th>
                                <th style="text-align: right;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="servicios-tbody">
                            <!-- JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Categorías -->
            <div class="admin-card">
                <div class="admin-card-header">
                    <h3>Categorías</h3>
                    <button class="btn-gold" id="btn-nueva-categoria" style="padding: 0.5rem 1rem; font-size: 0.75rem;"><i class="ph ph-plus"></i> Nueva Categoría</button>
                </div>
                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Servicios</th>
                                <th>Estado</th>
                                <th style="text-align: right;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="categorias-tbody">
                            <!-- JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal Servicio -->
    <div id="modal-servicio" class="modal-overlay">
        <div class="modal-container" style="max-width: 700px;">
            <div class="modal-header">
                <h3 id="modal-servicio-titulo">Nuevo Servicio</h3>
                <button class="modal-close" onclick="window.cerrarModalServicio()">&times;</button>
            </div>
            <form id="form-servicio">
                <input type="hidden" id="srv-id">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Nombre del servicio *</label>
                        <input type="text" id="srv-nombre" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Categoría *</label>
                        <select id="srv-categoria" class="form-control" required></select>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Precio (USD) *</label>
                        <input type="number" step="0.01" min="0" id="srv-precio" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Duración (minutos) *</label>
                        <input type="number" step="5" min="5" id="srv-duracion" class="form-control" value="60" required>
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select id="srv-activo" class="form-control">
                            <option value="true">Visible</option>
                            <option value="false">Oculto</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="srv-descripcion" class="form-control" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Imagen del servicio</label>
                    <input type="file" id="srv-imagen-file" class="form-control" accept="image/*">
                    <input type="hidden" id="srv-imagen-url">
                    <img id="srv-imagen-preview" src="" alt="Vista previa" style="width: 120px; height: 80px; object-fit: cover; border-radius: 6px; margin-top: 0.5rem; display: none;">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn-outline" onclick="window.cerrarModalServicio()">Cancelar</button>
                    <button type="submit" class="btn-gold">Guardar Servicio</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Categoría -->
    <div id="modal-categoria" class="modal-overlay">
        <div class="modal-container" style="max-width: 460px;">
            <div class="modal-header">
                <h3 id="modal-categoria-titulo">Nueva Categoría</h3>
                <button class="modal-close" onclick="window.cerrarModalCategoria()">&times;</button>
            </div>
            <form id="form-categoria">
                <input type="hidden" id="cat-id">
                <div class="form-group">
                    <label>Nombre de la categoría *</label>
                    <input type="text" id="cat-nombre" class="form-control" required maxlength="80" placeholder="Ej. Tratamientos Capilares">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn-outline" onclick="window.cerrarModalCategoria()">Cancelar</button>
                    <button type="submit" class="btn-gold">Guardar Categoría</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../js/admin/servicios.js"></script>
</body>
</html>
