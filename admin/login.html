<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo · MAISON AURUM</title>
    
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: radial-gradient(circle at center, #1c1c1c 0%, #0b0b0b 100%);
        }
        .login-card {
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="font-size: 1.75rem; letter-spacing: 0.1em; margin-bottom: 0.5rem;">MAISON <span>AURUM</span></h1>
                <p style="font-size: 0.85rem; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.2em;">Portal de Administración</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" class="form-control" required placeholder="admin@maisonaurum.com">
                </div>
                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" id="btn-login" class="btn-gold" style="width: 100%; margin-top: 1rem;">Iniciar Sesión</button>
            </form>
            <div id="login-error" style="color: var(--color-error); font-size: 0.85rem; text-align: center; margin-top: 1rem;"></div>
        </div>
    </div>

    <script type="module">
        import { supabase } from '../js/supabaseClient.js';

        const form = document.getElementById('login-form');
        const errorDiv = document.getElementById('login-error');
        const btnLogin = document.getElementById('btn-login');

        // Si ya hay sesión activa de admin, redirigir al dashboard
        supabase.auth.getSession().then(async ({ data: { session } }) => {
            if (session) {
                const { data: perfil } = await supabase.from('perfiles').select('*').eq('id', session.user.id).eq('rol', 'admin').single();
                if (perfil) window.location.href = 'dashboard.html';
            }
        });

        form.onsubmit = async (e) => {
            e.preventDefault();
            errorDiv.textContent = '';
            btnLogin.textContent = 'Verificando...';
            btnLogin.setAttribute('disabled', 'true');

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                errorDiv.textContent = 'Credenciales inválidas o acceso no autorizado.';
                btnLogin.textContent = 'Iniciar Sesión';
                btnLogin.removeAttribute('disabled');
                return;
            }

            // Verificar rol admin
            const { data: perfil, error: perfilErr } = await supabase
                .from('perfiles')
                .select('*')
                .eq('id', data.user.id)
                .eq('rol', 'admin')
                .single();

            if (perfilErr || !perfil) {
                errorDiv.textContent = 'Este usuario no tiene privilegios de administrador.';
                await supabase.auth.signOut();
                btnLogin.textContent = 'Iniciar Sesión';
                btnLogin.removeAttribute('disabled');
                return;
            }

            window.location.href = 'dashboard.html';
        };
    </script>
</body>
</html>
