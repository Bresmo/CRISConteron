<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Equipo · Admin Camilo Mideros</title>
    
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="admin-body">

    <!-- Sidebar dinámico inyectado por renderSidebar('equipo') -->
    <aside class="admin-sidebar"></aside>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-header">
            <div class="admin-header-title">
                <h1>Equipo de Estilistas y Rendimiento</h1>
            </div>
            <div class="admin-user-info">
                <span id="admin-user-name">Cargando...</span>
            </div>
        </header>

        <div class="admin-content">
            
            <!-- Nómina de Especialistas -->
            <div class="admin-card">
                <div class="admin-card-header">
                    <h3>Nómina de Especialistas</h3>
                    <button class="btn-gold" id="btn-nuevo-peluquero" style="padding: 0.5rem 1rem; font-size: 0.75rem;"><i class="ph ph-plus"></i> Nuevo Especialista</button>
                </div>
                <div class="admin-filters">
                    <input type="text" id="search-peluqueros" class="admin-search-input" placeholder="Buscar por nombre o especialidad...">
                    <select id="filtro-estado-peluquero" class="form-control" style="width: auto;">
                        <option value="">Todos los estados</option>
                        <option value="true">Activos</option>
                        <option value="false">Inactivos</option>
                    </select>
                    <select id="filtro-servicio-peluquero" class="form-control" style="width: auto;">
                        <option value="">Filtrar por servicio...</option>
                    </select>
                </div>
                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Foto</th>
                                <th>Nombre</th>
                                <th>Especialidad</th>
                                <th>Comisión %</th>
                                <th>Estado</th>
                                <th style="text-align: right;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="peluqueros-tbody">
                            <!-- JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Panel de Rendimiento por Peluquero -->
            <div class="admin-card">
                <div class="admin-card-header">
                    <h3>Rendimiento y Facturación por Especialista</h3>
                    <div style="display: flex; gap: 0.75rem; align-items: center;">
                        <label style="font-size: 0.75rem; text-transform: uppercase; color: var(--color-text-secondary);">Mes:</label>
                        <input type="month" id="rendimiento-mes" class="form-control" style="width: auto;">
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Especialista</th>
                                <th>Comisión %</th>
                                <th>Servicios Realizados</th>
                                <th>Total Facturado</th>
                                <th>Comisión Generada</th>
                            </tr>
                        </thead>
                        <tbody id="rendimiento-tbody">
                            <!-- JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal Peluquero -->
    <div id="modal-peluquero" class="modal-overlay">
        <div class="modal-container" style="max-width: 700px;">
            <div class="modal-header">
                <h3 id="modal-peluquero-titulo">Nuevo Especialista</h3>
                <button class="modal-close" onclick="window.cerrarModalPeluquero()">&times;</button>
            </div>
            <form id="form-peluquero">
                <input type="hidden" id="pel-id">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Nombre y Apellido *</label>
                        <input type="text" id="pel-nombre" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Especialidad</label>
                        <input type="text" id="pel-especialidad" class="form-control" placeholder="Ej. Master Colorista">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" id="pel-telefono" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Comisión (%) *</label>
                        <input type="number" step="0.1" id="pel-comision" class="form-control" value="40.0" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Biografía corta</label>
                    <textarea id="pel-bio" class="form-control" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>Estado</label>
                    <select id="pel-activo" class="form-control">
                        <option value="true">Activo</option>
                        <option value="false">Inactivo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Foto de Perfil</label>
                    <input type="file" id="pel-foto-file" class="form-control" accept="image/*">
                    <input type="hidden" id="pel-foto-url">
                    <img id="pel-foto-preview" src="" alt="Vista previa" style="width: 70px; height: 70px; object-fit: cover; border-radius: 50%; margin-top: 0.5rem; display: none;">
                </div>

                <div class="form-group" style="margin-top: 1.5rem;">
                    <label style="margin-bottom: 0.75rem; color: var(--color-accent); display: block; font-weight: 600;">Servicios que realiza:</label>
                    <div id="pel-servicios-checkboxes" style="max-height: 200px; overflow-y: auto; background: var(--color-bg-card); padding: 1rem; border-radius: var(--radius-sm);">
                        <!-- JS -->
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn-outline" onclick="window.cerrarModalPeluquero()">Cancelar</button>
                    <button type="submit" class="btn-gold">Guardar Especialista</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Horarios Semanales -->
    <div id="modal-horarios" class="modal-overlay">
        <div class="modal-container" style="max-width: 650px;">
            <div class="modal-header">
                <h3 id="horario-modal-titulo">Horario Semanal</h3>
                <button class="modal-close" onclick="window.cerrarModalHorarios()">&times;</button>
            </div>
            <form id="form-horarios">
                <input type="hidden" id="horario-peluquero-id">
                <div id="horarios-dias-container" style="margin-bottom: 1.5rem;">
                    <!-- JS -->
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                    <button type="button" class="btn-outline" onclick="window.cerrarModalHorarios()">Cancelar</button>
                    <button type="submit" class="btn-gold">Guardar Horarios</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../js/admin/equipo.js"></script>
</body>
</html>
